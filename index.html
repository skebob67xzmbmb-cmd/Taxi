<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Такси 24/7</title>
  <style>
    :root {
      --bg: #0f1115; --card: #1c1f26; --text: #fff; --muted: #8b92a5; --accent: #ffcc00; --border: #2a2e39;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .container {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 32px; width: 100%; max-width: 400px;
    }
    h1 { text-align: center; font-size: 24px; margin-bottom: 8px; }
    p.lead { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: 14px; }
    form { display: flex; flex-direction: column; gap: 16px; }
    label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    input, select {
      width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 16px; background: var(--bg); color: var(--text);
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button {
      background: var(--accent); color: #000; border: none; padding: 16px;
      border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    .status { text-align: center; margin-top: 16px; font-size: 14px; font-weight: 600; color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Вызов Такси</h1>
    <p class="lead">Машина приедет за 5 минут. Фиксированный тариф.</p>
    <form id="orderForm">
      <div><label>Откуда</label><input id="from" type="text" placeholder="Улица, дом" required></div>
      <div><label>Куда</label><input id="to" type="text" placeholder="Куда едем?" required></div>
      <div><label>Телефон</label><input id="phone" type="tel" placeholder="+7 (999) 123-45-67" required></div>
      <div>
        <label>Тариф</label>
        <select id="tariff">
          <option value="Эконом">Эконом</option>
          <option value="Комфорт">Комфорт</option>
          <option value="Межгород">Межгород</option>
        </select>
      </div>
      <button type="submit" id="submitBtn">Заказать машину</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    // ВСТАВЬ СЮДА СВОИ ДАННЫЕ, ИНАЧЕ БУДЕТ ОШИБКА!
    const TG_TOKEN = '8866879438:AAHAy65jRIc75rH8j8eKsZ-skQy9gzsnt0s';
const TG_CHAT_ID = '7637235468';

    const form = document.getElementById('orderForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const phone = document.getElementById('phone').value;
      const tariff = document.getElementById('tariff').value;

      const message = `🚖 *НОВЫЙ ЗАКАЗ!*\n\n📍 Откуда: ${from}\n🏁 Куда: ${to}\n📱 Тел: ${phone}\n💺 Тариф: ${tariff}`;

      statusEl.textContent = 'Отправляем...';
      statusEl.className = 'status';
      submitBtn.disabled = true;

      try {
        const response = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TG_CHAT_ID, text: message, parse_mode: 'Markdown' })
        });

        if (response.ok) {
          statusEl.textContent = '✅ Заявка принята!';
          form.reset();
        } else {
          throw new Error('Ошибка');
        }
      } catch (error) {
        statusEl.textContent = '❌ Ошибка отправки.';
        statusEl.className = 'status error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
