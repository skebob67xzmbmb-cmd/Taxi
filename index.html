<script>
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNonpe6xaV48KniFJpTSop_s16GRDoz7vm920TICVjQap2MIg7hnaF0PtaEhY-9_9h/exec';

  const form = document.getElementById('orderForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const data = {
      from: document.getElementById('from').value,
      to: document.getElementById('to').value,
      phone: document.getElementById('phone').value,
      tariff: document.getElementById('tariff').value
    };

    statusEl.textContent = 'Отправляем...';
    statusEl.className = 'status';
    submitBtn.disabled = true;

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      });
      
      statusEl.textContent = '✅ Заявка принята! Диспетчер свяжется.';
      statusEl.className = 'status success';
      form.reset();
    } catch (error) {
      statusEl.textContent = '❌ Ошибка. Попробуйте позже.';
      statusEl.className = 'status error';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
